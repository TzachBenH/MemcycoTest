# Scheduling System: PostgreSQL 15 + two backend instances (one Quartz cluster) + the UI behind nginx.
#
#   docker compose -f docker/docker-compose.yml up --build
#
#   UI        http://localhost:3000                 nginx: the React app + /api round robin to backend-1 / backend-2
#   Swagger   http://localhost:8080/swagger-ui.html backend-1 (the API is also reachable here directly)
#   Postgres  localhost:5433                        user / password / database: scheduler
#
# Defaults can be overridden in docker/.env (see .env.example).
#
# Both backends share one database, and starting them together is safe:
#   - Flyway serializes migrations with a PostgreSQL advisory lock: one instance migrates, the other waits.
#   - Quartz runs as a cluster on the shared JDBC job store (row locks in qrtz_locks): every trigger fires on
#     exactly one instance, and if one instance dies the other takes over its schedulings.
# The history page's "Instance" column (executed_by) shows which instance ran each execution.

name: scheduling-system

x-backend: &backend
  build:
    context: ..
    dockerfile: docker/backend/Dockerfile
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment: &backend-environment
    SPRING_PROFILES_ACTIVE: docker
    DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-scheduler}
    DB_USER: ${POSTGRES_USER:-scheduler}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-scheduler}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
    QUARTZ_THREADS: ${QUARTZ_THREADS:-10}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  # Time for running tasks to finish on shutdown (Quartz waits for them).
  stop_grace_period: 30s
  deploy:
    resources:
      limits:
        # The JVM sizes its heap from this limit (MaxRAMPercentage=75).
        memory: ${BACKEND_MEMORY_LIMIT:-1g}

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheduler}
    ports:
      # 5433 on the host, so it does not clash with a locally installed PostgreSQL on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first-time initialization PostgreSQL only listens on its Unix socket, so this check
      # passes only once the real server accepts connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend-1:
    <<: *backend
    environment:
      <<: *backend-environment
      INSTANCE_ID: backend-1
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  backend-2:
    <<: *backend
    environment:
      <<: *backend-environment
      INSTANCE_ID: backend-2

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pgdata:
