# Serves the React single-page app and proxies the API to both backend instances.
# Included into the http {} block of the stock nginx.conf (as conf.d/default.conf).

# Docker's embedded DNS. Backend names are re-resolved at runtime (the "resolve" parameter below, nginx >= 1.27.3,
# i.e. any current stable image), so a restarted or recreated backend container is found again without restarting
# nginx, and nginx starts even if a backend is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

# Round robin over the two instances of the Quartz cluster. Every request may go to either instance: the
# backend is stateless (all state, including edit locks, lives in PostgreSQL).
upstream scheduler_backend {
    zone scheduler_backend 64k;
    server backend-1:8080 resolve max_fails=3 fail_timeout=10s;
    server backend-2:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Container health check (no access log noise).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API: the /api prefix is kept (proxy_pass without a URI part).
    location /api/ {
        proxy_pass http://scheduler_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # If one instance is down, idempotent requests are retried on the other one.
        # (nginx never re-sends POST/PUT/DELETE that already reached a backend.)
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Vite emits content-hashed file names under /assets: cache them "forever".
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, so a new deployment is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths (e.g. /schedulings/<id>/history) are routed by React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
